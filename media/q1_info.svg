<svg xmlns="http://www.w3.org/2000/svg" width="360" height="521" viewBox="0 0 360 521"><rect width="360" height="521" fill="#fffdf8"/><text x="16.0" y="40.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="22" font-weight="900" fill="#1a1a1a" text-anchor="start">兩年內從行道樹名單消失的樹，</text><text x="16.0" y="70.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="22" font-weight="900" fill="#1a1a1a" text-anchor="start">有 499 個位置可以先補</text><rect x="16" y="92" width="328.0" height="40" rx="4" fill="#c9c9c9"/><text x="26.0" y="119.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="900" fill="#1a1a1a" text-anchor="start">9,363 個樹籍</text><text x="16.0" y="146.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">兩年內從行道樹名單消失</text><text x="16.0" y="161.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">2024 年 11 月 21 日名單上有、2026 年 10 月 20 日名單上找不到</text><rect x="16" y="181" width="64.8" height="40" rx="4" fill="#666666"/><text x="88.8" y="208.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="900" fill="#1a1a1a" text-anchor="start">1,851 個位置</text><text x="16.0" y="235.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">樹穴還在、人行道 2 公尺以上</text><text x="16.0" y="250.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">原址 6 公尺內現在沒有任何樹，2 公尺內有樹穴，</text><text x="16.0" y="265.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">人行道寬 2 公尺以上</text><rect x="16" y="285" width="17.5" height="40" rx="4" fill="#C8102E"/><text x="41.5" y="312.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="900" fill="#C8102E" text-anchor="start">499 個</text><text x="16.0" y="339.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="14" font-weight="700" fill="#C8102E" text-anchor="start">在樹蔭不夠的 102 個里</text><text x="16.0" y="354.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">樹冠三成、300 公尺有公園兩項都沒做到的里</text><line x1="16" y1="378" x2="344" y2="378" stroke="#c9c9c9" stroke-dasharray="4 4"/><text x="16.0" y="395.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">公園處一年移除 3,164 棵是另一本帳，</text><text x="16.0" y="412.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">跟這條漏斗不能相減（議員轉述公園處 2025 年統計，</text><text x="16.0" y="429.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">自由時報 2026 年 7 月 13 日）。</text><text x="16.0" y="448.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">樹穴圖只蓋到 36% 的行道樹，所以 1,851 與 499 是下限。</text><text x="16.0" y="467.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">資料：公園處行道樹分布圖（2024 年 11 月 21 日版取自 </text><text x="16.0" y="484.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">Internet Archive）、新工處樹穴圖與人行道範圍圖（2026 年 </text><text x="16.0" y="501.0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="start">1 月 14 日更新）。</text></svg>